data:
  input_path: data\raw\training.1600000.processed.noemoticon.csv
  name: 'twitter Reviews'
  text_column: 'text'
  label_column: 'sentiment'
  sample_size: 10000
  encoding: 'latin-1'
  label_type: 'twitter'

preprocessing:
  domain: 'twitter'
  remove_stopwords: true
  lemmatization: true

vectorization:
  type: 'embeddings'
  max_features: 5000
  ngram_range: [1, 2]

  embeddings:
    type: 'glove'
    embedding_path: 'glove.6B\glove.6B.50d.txt'
    vector_size: 300
    window: 5
    min_count: 2
    workers: 4

model:
  type: 'random_forest'
  max_iter: 1000
  random_state: 42
  test_size: 0.2
  max_depth: 10
  n_estimators: 100

  evaluation:
    metrics:
      - accuracy
      - f1_score
      - precision
      - recall

experiment:
  name: nlp_vectorization_comparison
